services:
  - type: web
    name: tourmate-ai-game-agent
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run prisma:deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: TourMate AI
      - key: GEMMA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
